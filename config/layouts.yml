global:
  screen_width: 1920
  screen_height: 1080
  background_color: "#000000"
  fps_limit: 60
  pixel_perfect: true
  initial_screen: "main_game"

# Screen definitions
screens:
  # Main Game Screen using available sprites
  main_game:
    background_color: "#1a1a2e"
    music: "assets/audio/menu_theme.ogg"
    sprites:
      # Background image (large)
      game_background:
        texture: "background.png"
        position:
          x: 960
          y: 540
        z_order: 1
        visible: true
        scale:
          x: 1.8
          y: 1.3
      
      # Game logo
      title_logo:
        texture: "td-logo.png"
        position:
          x: 960
          y: 200
        z_order: 10
        visible: true
      
      # Domino pieces
      domino_1:
        texture: "1.png"
        position:
          x: 400
          y: 400
        z_order: 20
        visible: true
        
      domino_2:
        texture: "2.png"
        position:
          x: 500
          y: 400
        z_order: 20
        visible: true
        
      domino_3:
        texture: "3.png"
        position:
          x: 600
          y: 400
        z_order: 20
        visible: true

      domino_4:
        texture: "4.png"
        position:
          x: 700
          y: 400
        z_order: 20
        visible: true

      domino_5:
        texture: "5.png"
        position:
          x: 800
          y: 400
        z_order: 20
        visible: true

      domino_6:
        texture: "6.png"
        position:
          x: 900
          y: 400
        z_order: 20
        visible: true
      
      # Game base elements
      game_base:
        texture: "base.png"
        position:
          x: 960
          y: 800
        z_order: 15
        visible: true
        
      # Player frames
      player_frames:
        texture: "frames_players.png"
        position:
          x: 960
          y: 900
        z_order: 5
        visible: true
        scale:
          x: 1.8
          y: 1.0

      # Player avatars
      player_man:
        texture: "man.jpg"
        position:
          x: 300
          y: 200
        z_order: 25
        visible: true

      player_woman:
        texture: "woman.jpg"
        position:
          x: 1620
          y: 200
        z_order: 25
        visible: true

      # CPU opponents
      cpu_1:
        texture: "CPU1.jpg"
        position:
          x: 300
          y: 880
        z_order: 25
        visible: true

      cpu_2:
        texture: "CPU2.jpg"
        position:
          x: 1620
          y: 880
        z_order: 25
        visible: true

  # Test screen for development
  test_screen:
    background_color: "#333333"
    sprites:
      test_sprite:
        texture: "1.png"
        position:
          x: 960
          y: 540
        z_order: 10
        visible: true
        scale:
          x: 2.0
          y: 2.0

      test_background:
        texture: "background.png"
        position:
          x: 960
          y: 540
        z_order: 1
        visible: true
        scale:
          x: 1.8
          y: 1.3

      test_logo:
        texture: "td-logo.png"
        position:
          x: 960
          y: 200
        z_order: 5
        visible: true

  # Menu screen
  menu_screen:
    background_color: "#0d1421"
    sprites:
      menu_background:
        texture: "background.png"
        position:
          x: 960
          y: 540
        z_order: 1
        visible: true
        scale:
          x: 1.8
          y: 1.3

      menu_logo:
        texture: "td-logo.png"
        position:
          x: 960
          y: 300
        z_order: 10
        visible: true
        scale:
          x: 1.5
          y: 1.5

      start_button:
        texture: "base_line.png"
        position:
          x: 960
          y: 600
        z_order: 15
        visible: true